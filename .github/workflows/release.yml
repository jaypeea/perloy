name: Build Perloy desktop installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or update (for example v1.0.1)
        required: true
        type: string

env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_WINDOWS_INSTALLER_URL: ${{ vars.VITE_WINDOWS_INSTALLER_URL }}
  VITE_MAC_INSTALLER_URL: ${{ vars.VITE_MAC_INSTALLER_URL }}

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:win
      - uses: actions/upload-artifact@v7
        with:
          name: perloy-windows
          path: release/Perloy-Setup.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:build:mac
      - uses: actions/upload-artifact@v7
        with:
          name: perloy-macos
          path: release/Perloy.dmg
          if-no-files-found: error

  release:
    runs-on: ubuntu-latest
    needs: [windows, macos]
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
      - name: Create release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "Perloy $RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
          fi
          gh release upload "$RELEASE_TAG" \
            release-assets/perloy-windows/Perloy-Setup.exe \
            release-assets/perloy-macos/Perloy.dmg \
            --clobber
